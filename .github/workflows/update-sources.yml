name: Update package source pins

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      odhcpd_ref:
        description: Optional full JxnLexn/openwrt-odhcpd commit
        required: false
        type: string
  repository_dispatch:
    types: [odhcpd-updated]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-package-source-pins
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'JxnLexn/openwrt-packages'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Resolve and verify odhcpd source
        env:
          DISPATCH_REF: ${{ github.event.client_payload.source_ref }}
          INPUT_REF: ${{ inputs.odhcpd_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_ref=${DISPATCH_REF:-${INPUT_REF:-}}
          if [[ -z "$source_ref" ]]; then
            source_ref=$(curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              'https://api.github.com/repos/JxnLexn/openwrt-odhcpd/commits?per_page=1' \
              | jq -er '.[0].sha')
          fi
          bash scripts/prepare-odhcpd-source.sh \
            packages/odhcpd/Makefile "$source_ref"

      - name: Commit changed pin
        id: update
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/odhcpd/Makefile; then
            echo 'odhcpd is already pinned to the latest selected commit'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_ref=$(sed -n \
            's/^PKG_SOURCE_VERSION:=//p' packages/odhcpd/Makefile)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/odhcpd/Makefile
          git commit -m "Update odhcpd to ${source_ref:0:8}"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Start build and publication
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-feed.yml/dispatches" \
            -d '{"ref":"main"}'
