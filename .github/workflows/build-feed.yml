name: Build and publish APK feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-feed-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_RELEASE: 25.12.5

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target: x86
            subtarget: "64"
            sdk_file: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            packages: odhcpd-ipv6only

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang curl flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            jq rsync swig unzip zlib1g-dev file wget zstd

      - name: Download pinned OpenWrt SDK
        env:
          SDK_FILE: ${{ matrix.sdk_file }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          set -euo pipefail
          url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${TARGET}/${SUBTARGET}/${SDK_FILE}"
          wget --https-only --output-document="$RUNNER_TEMP/$SDK_FILE" "$url"
          echo "$SDK_SHA256  $RUNNER_TEMP/$SDK_FILE" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/sdk"
          tar --zstd --extract --file="$RUNNER_TEMP/$SDK_FILE" \
            --directory="$RUNNER_TEMP/sdk" --strip-components=1

      - name: Install package recipe and dependencies
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sdk"
          sed -i \
            's#https://git.openwrt.org/openwrt/openwrt.git#https://github.com/openwrt/openwrt.git#' \
            "$sdk/feeds.conf.default"
          "$sdk/scripts/feeds" update base
          cp packages/odhcpd/Makefile \
            "$sdk/feeds/base_root/package/network/services/odhcpd/Makefile"
          cp -a packages/odhcpd/files/. \
            "$sdk/feeds/base_root/package/network/services/odhcpd/files/"
          "$sdk/scripts/feeds" update -i base
          "$sdk/scripts/feeds" install -p base \
            libjson-c libubox uci ubus libnl-tiny odhcpd-ipv6only
          printf '%s\n' 'CONFIG_PACKAGE_odhcpd-ipv6only=y' >> "$sdk/.config"
          make -C "$sdk" defconfig

      - name: Build odhcpd packages
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/sdk" package/odhcpd/clean
          make -C "$RUNNER_TEMP/sdk" package/odhcpd/compile -j1 V=s

      - name: Collect packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          feed_dir="$RUNNER_TEMP/feed/${OPENWRT_RELEASE}/${ARCHITECTURE}"
          mkdir -p "$feed_dir"
          find "$RUNNER_TEMP/sdk/bin/packages" -type f \
            -name 'odhcpd-ipv6only-*.apk' \
            -exec cp -v {} "$feed_dir/" \;
          test "$(find "$feed_dir" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1

      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ env.OPENWRT_RELEASE }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/feed
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign and publish feed
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'JxnLexn/openwrt-packages'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-*
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true

      - name: Download pinned SDK host tools
        run: |
          set -euo pipefail
          sdk_file=openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          sdk_sha256=0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
          url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/x86/64/$sdk_file"
          wget --https-only --output-document="$RUNNER_TEMP/$sdk_file" "$url"
          echo "$sdk_sha256  $RUNNER_TEMP/$sdk_file" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/sdk"
          tar --zstd --extract --file="$RUNNER_TEMP/$sdk_file" \
            --directory="$RUNNER_TEMP/sdk" --strip-components=1

      - name: Sign aggregate indexes
        env:
          APK_REPOSITORY_KEY: ${{ secrets.APK_REPOSITORY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_REPOSITORY_KEY" ]]; then
            echo 'APK_REPOSITORY_KEY is not configured' >&2
            exit 1
          fi

          private_key="$RUNNER_TEMP/jxnlexn-openwrt-packages.key"
          public_key="$RUNNER_TEMP/jxnlexn-openwrt-packages.pem"
          umask 077
          printf '%s\n' "$APK_REPOSITORY_KEY" > "$private_key"
          openssl ec -in "$private_key" -pubout -out "$public_key"

          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp "$public_key" "$site/jxnlexn-openwrt-packages.pem"
          touch "$site/.nojekyll"

          apk_tool="$RUNNER_TEMP/sdk/staging_dir/host/bin/apk"
          while IFS= read -r -d '' feed_dir; do
            cp "$public_key" "$feed_dir/jxnlexn-openwrt-packages.pem"
            (
              cd "$feed_dir"
              "$apk_tool" adbsign --allow-untrusted --reset-signatures \
                --sign-key "$private_key" ./*.apk
              "$apk_tool" mkndx --allow-untrusted \
                --sign "$private_key" --output packages.adb ./*.apk
            )
            bash scripts/verify-feed.sh \
              "$apk_tool" "$feed_dir" "$(basename "$feed_dir")"
          done < <(find "$RUNNER_TEMP/unsigned" -mindepth 2 -maxdepth 2 -type d -print0)

          cp -a "$RUNNER_TEMP/unsigned/." "$site/"
          openssl pkey -pubin -in "$public_key" -outform DER \
            | sha256sum | awk '{print $1}' > "$site/PUBLIC_KEY_SHA256"
          find "$site" -type f -printf '%P\n' | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
